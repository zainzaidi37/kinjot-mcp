name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The monorepo's sync writes pnpm-lock.yaml as one YAML document. pnpm 11+
    # under its default pmOnFail records its own version in a second document
    # and refuses a frozen install without it, so this job runs pnpm under
    # pmOnFail ignore. The action reads the version from packageManager, which
    # the sync copies (kinjot docs/mcp-mirror.md).
    env:
      pnpm_config_pm_on_fail: ignore
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
